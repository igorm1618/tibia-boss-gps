  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(59, 130, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }
    .active-card {
      border-color: #3b82f6 !important;
      background: linear-gradient(90deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%) !important;
    }
    .active-sprite-box {
      animation: pulse-ring 2s infinite;
      border-color: #60a5fa !important;
    }
    .red-cross {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .red-cross svg {
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.95));
    }
  </style>
</head>

    function updateUI() {
      const indicator = document.getElementById('gps-step-indicator');
      const targetName = document.getElementById('current-target-name');
      const targetLoc = document.getElementById('current-target-loc');

      if (currentStage <= 4) {
        indicator.textContent = `Etapa ${currentStage}/4`;
        indicator.className = 'text-xs font-semibold text-blue-400 bg-blue-950/70 border border-blue-800/80 px-2 py-0.5 rounded';
        targetName.textContent = bosses[currentStage - 1].name;
        targetLoc.textContent = bosses[currentStage - 1].shortLoc;
      } else {
        indicator.textContent = 'ROTA CONCLUÍDA!';
        indicator.className = 'text-xs font-semibold text-emerald-400 bg-emerald-950/70 border border-emerald-800/80 px-2 py-0.5 rounded';
        targetName.textContent = 'Todos Derrotados!';
        targetLoc.textContent = 'Parabéns!';
      }

      // Update dot buttons
      for (let s = 1; s <= 5; s++) {
        const dot = document.getElementById(`dot-${s}`);
        if (s === currentStage) {
          dot.className = 'w-5 h-5 rounded text-[10px] font-bold bg-blue-600 text-white flex items-center justify-center ring-2 ring-blue-400';
        } else {
          dot.className = 'w-5 h-5 rounded text-[10px] font-bold bg-[#1e2536] text-slate-400 hover:text-white flex items-center justify-center';
        }
      }

      bosses.forEach((b, index) => {
        const stepNum = index + 1;
        const card = document.getElementById(`card-${stepNum}`);
        const box = document.getElementById(`box-${stepNum}`);
        const img = document.getElementById(`img-${stepNum}`);
        const cross = document.getElementById(`cross-${stepNum}`);
        const name = document.getElementById(`name-${stepNum}`);
        const loc = document.getElementById(`loc-${stepNum}`);
        const badge = document.getElementById(`badge-${stepNum}`);
        const bar = document.getElementById(`bar-${stepNum}`);

        if (stepNum < currentStage) {
          // DEFEATED: Red X on top, grayscale sprite, full green bar
          card.className = 'cursor-pointer transition-all duration-200 rounded-lg p-2.5 border border-[#2b3348] bg-[#141722] flex items-center gap-3 opacity-80';
          box.className = 'relative w-14 h-14 bg-[#10131a] rounded border border-[#282f42] flex items-center justify-center shrink-0';
          img.className = 'w-12 h-12 object-contain grayscale opacity-50 transition-all duration-300';
          cross.style.display = 'flex';
          name.className = 'font-bold text-sm text-slate-400 line-through decoration-red-500/70';
          loc.className = 'text-xs text-slate-500 truncate mt-0.5';
          badge.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-950/80 text-emerald-400 border border-emerald-700/60';
          badge.textContent = 'DERROTADO';
          bar.className = 'bg-emerald-500 h-full w-full rounded-full transition-all duration-300';
        } else if (stepNum === currentStage) {
          // ACTIVE: Vibrant RGB color, blue glowing border, active badge
          card.className = 'cursor-pointer transition-all duration-200 rounded-lg p-2.5 active-card flex items-center gap-3 border-2 border-blue-500 shadow-lg';
          box.className = 'relative w-14 h-14 bg-[#10131a] rounded border-2 border-blue-400 active-sprite-box flex items-center justify-center shrink-0';
          img.className = 'w-12 h-12 object-contain filter-none opacity-100 scale-105 transition-all duration-300';
          cross.style.display = 'none';
          name.className = 'font-bold text-sm text-white drop-shadow';
          loc.className = 'text-xs text-blue-400 font-medium truncate mt-0.5';
          badge.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-blue-600 text-white border border-blue-400 animate-pulse';
          badge.textContent = 'ALVO ATUAL';
          bar.className = 'bg-blue-500 h-full w-3/4 rounded-full transition-all duration-300';
        } else {
          // PENDING: Grayscale, dimmed, empty bar
          card.className = 'cursor-pointer transition-all duration-200 rounded-lg p-2.5 border border-[#232938] bg-[#141722] flex items-center gap-3 opacity-60';
          box.className = 'relative w-14 h-14 bg-[#10131a] rounded border border-[#282f42] flex items-center justify-center shrink-0';
          img.className = 'w-12 h-12 object-contain grayscale opacity-40 transition-all duration-300';
          cross.style.display = 'none';
          name.className = 'font-bold text-sm text-slate-500';
          loc.className = 'text-xs text-slate-600 truncate mt-0.5';
          badge.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-[#1e2333] text-slate-500 border border-[#2e374d]';
          badge.textContent = 'AGUARDANDO';
          bar.className = 'bg-slate-700 h-full w-0 rounded-full transition-all duration-300';
        }
      });
    }

    function selectStage(s) {
      currentStage = s;
      updateUI();
    }

    function nextStage() {
      if (currentStage < 5) {
        currentStage++;
        updateUI();
      }
    }

    function prevStage() {
      if (currentStage > 1) {
        currentStage--;
        updateUI();
      }
    }

    updateUI();
  </script>
</body>
</html>
